
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой учебный трекер</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --white: #ffffff;
      --text: #172033;
      --muted: #788398;
      --primary: #635bdb;
      --primary-light: #eeedff;
      --green: #169c6b;
      --border: #e7eaf2;
      --danger: #dc5260;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header { margin-bottom: 28px; }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 6px 24px rgba(30, 40, 70, 0.035);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .stat {
      background: #f7f8fc;
      padding: 18px;
      border-radius: 14px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }

    .stat-unit {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 0 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      border-radius: 20px;
      background: #e9eaf3;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #7369eb, #47b8ab);
      transition: width 0.3s ease;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    .add-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 125px auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: white;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    /* Стили ошибок валидации */
    input[aria-invalid="true"] {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px rgba(220, 82, 96, 0.1);
    }

    .field-error {
      margin: 6px 0 0;
      color: var(--danger);
      font-size: 12px;
      line-height: 1.4;
    }

    button {
      cursor: pointer;
      font: inherit;
      transition: background 0.2s, color 0.2s;
    }

    .add-btn {
      height: 44px;
      padding: 0 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .add-btn:hover { background: #5148bf; }

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 18px;
    }

    .tasks-header .section-title { margin: 0; }

    .filters {
      display: flex;
      gap: 5px;
      padding: 4px;
      background: #f3f4f8;
      border-radius: 11px;
    }

    .filter-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .filter-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: background 0.2s;
    }

    .task:hover { background: #fafbff; }

    .task-check {
      width: 20px;
      height: 20px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .task.done .task-name {
      text-decoration: line-through;
      color: #9ba3b4;
    }

    .task-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .task.done .task-status { color: var(--green); }

    .hours-badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: #a1a8b6;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1;
    }

    .delete-btn:hover {
      background: #fff0f1;
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body { padding: 22px 12px; }
      h1 { font-size: 26px; }
      .card { padding: 17px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-value { font-size: 21px; }
      .stat-label { font-size: 11px; }

      .add-form {
        grid-template-columns: 1fr 105px;
      }

      .add-btn { grid-column: 1 / -1; }
      .filters { width: 100%; }
      .filter-btn { flex: 1; }
      .task { gap: 10px; padding: 12px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>Мой учебный трекер 📚</h1>
      <p class="subtitle">
        Планируй учебные задачи и отслеживай свой прогресс.
      </p>
    </header>

    <section class="card" aria-label="Статистика">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Всего задач</div>
          <div class="stat-value" id="totalTasks">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Запланировано</div>
          <div class="stat-value">
            <span id="totalHours">0</span>
            <span class="stat-unit">ч</span>
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">Выполнено</div>
          <div class="stat-value">
            <span id="doneHours">0</span>
            <span class="stat-unit">ч</span>
          </div>
        </div>
      </div>

      <div class="progress-head">
        <span>Общий прогресс</span>
        <span id="progressText">0%</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="Прогресс выполнения по часам"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressTrack"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">Добавить задачу</h2>

      <!-- novalidate отключает стандартные подсказки браузера -->
      <form id="taskForm" class="add-form" novalidate>
        <div>
          <label for="taskName">Название задачи</label>
          <input
            type="text"
            id="taskName"
            placeholder="Например, изучить Python"
            maxlength="120"
            aria-describedby="taskNameError"
            aria-invalid="false"
            required
          >
          <p
            class="field-error"
            id="taskNameError"
            role="alert"
            hidden
          ></p>
        </div>

        <div>
          <label for="taskHours">Часы</label>
          <input
            type="number"
            id="taskHours"
            min="0.5"
            max="24"
            step="0.5"
            value="1"
            aria-describedby="taskHoursError"
            aria-invalid="false"
            required
          >
          <p
            class="field-error"
            id="taskHoursError"
            role="alert"
            hidden
          ></p>
        </div>

        <button type="submit" class="add-btn">
          + Добавить
        </button>
      </form>
    </section>

    <section class="card">
      <div class="tasks-header">
        <h2 class="section-title">Мои задачи</h2>

        <div class="filters" aria-label="Фильтр задач">
          <button
            type="button"
            class="filter-btn active"
            data-filter="all"
            aria-pressed="true"
          >Все</button>

          <button
            type="button"
            class="filter-btn"
            data-filter="active"
            aria-pressed="false"
          >Активные</button>

          <button
            type="button"
            class="filter-btn"
            data-filter="done"
            aria-pressed="false"
          >Готовые</button>
        </div>
      </div>

      <div id="taskList" class="task-list"></div>
    </section>

    <p class="footer-note">
      Все изменения автоматически сохраняются в этом браузере.
    </p>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "study-tracker-v1";

    const initialTasks = [
      { id: "example-1", name: "Чтение", hours: 2, done: true },
      { id: "example-2", name: "Практика", hours: 4, done: false },
      { id: "example-3", name: "Повторение", hours: 2, done: false }
    ];

    let tasks = loadTasks();
    let currentFilter = "all";

    const taskForm = document.getElementById("taskForm");
    const taskName = document.getElementById("taskName");
    const taskHours = document.getElementById("taskHours");
    const taskList = document.getElementById("taskList");

    const taskNameError = document.getElementById("taskNameError");
    const taskHoursError = document.getElementById("taskHoursError");

    const filterButtons = document.querySelectorAll(".filter-btn");

    function loadTasks() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved !== null) {
          const parsed = JSON.parse(saved);

          if (Array.isArray(parsed)) {
            return parsed.filter(task =>
              task &&
              typeof task.id === "string" &&
              typeof task.name === "string" &&
              typeof task.hours === "number" &&
              Number.isFinite(task.hours) &&
              task.hours > 0 &&
              typeof task.done === "boolean"
            );
          }
        }
      } catch (error) {
        console.warn("Не удалось загрузить задачи:", error);
      }

      return initialTasks.map(task => ({ ...task }));
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (error) {
        console.warn("Не удалось сохранить задачи:", error);
      }
    }

    function formatHours(value) {
      return Number(value.toFixed(2)).toLocaleString("ru-RU");
    }

    function updateStatistics() {
      const total = tasks.length;

      const totalHours = tasks.reduce(
        (sum, task) => sum + task.hours, 0
      );

      const completedHours = tasks.reduce(
        (sum, task) => sum + (task.done ? task.hours : 0), 0
      );

      const percentage = totalHours > 0
        ? Math.round(completedHours / totalHours * 100)
        : 0;

      document.getElementById("totalTasks").textContent = total;
      document.getElementById("totalHours").textContent =
        formatHours(totalHours);
      document.getElementById("doneHours").textContent =
        formatHours(completedHours);

      document.getElementById("progressText").textContent =
        percentage + "%";

      document.getElementById("progressFill").style.width =
        percentage + "%";

      document.getElementById("progressTrack").setAttribute(
        "aria-valuenow", percentage
      );
    }

    function getVisibleTasks() {
      if (currentFilter === "active") {
        return tasks.filter(task => !task.done);
      }

      if (currentFilter === "done") {
        return tasks.filter(task => task.done);
      }

      return tasks;
    }

    function renderTasks() {
      taskList.replaceChildren();

      const visibleTasks = getVisibleTasks();

      if (visibleTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";

        empty.textContent =
          currentFilter === "active"
            ? "Нет активных задач 🎉"
            : currentFilter === "done"
            ? "Пока нет выполненных задач"
            : "Задач пока нет. Добавь первую!";

        taskList.appendChild(empty);
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-check";
        checkbox.checked = task.done;
        checkbox.setAttribute(
          "aria-label", "Задача выполнена: " + task.name
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          render();
        });

        const info = document.createElement("div");
        info.className = "task-info";

        const name = document.createElement("div");
        name.className = "task-name";
        name.textContent = task.name;

        const status = document.createElement("div");
        status.className = "task-status";
        status.textContent = task.done
          ? "✓ Выполнено"
          : "○ В процессе";

        info.append(name, status);

        const hours = document.createElement("span");
        hours.className = "hours-badge";
        hours.textContent = formatHours(task.hours) + " ч";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "×";
        deleteButton.title = "Удалить задачу";
        deleteButton.setAttribute(
          "aria-label", "Удалить задачу: " + task.name
        );

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        item.append(checkbox, info, hours, deleteButton);
        taskList.appendChild(item);
      });

      updateStatistics();
    }

    function render() {
      renderTasks();

      filterButtons.forEach(button => {
        const isActive = button.dataset.filter === currentFilter;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    // ============================================
    // ВАЛИДАЦИЯ ФОРМЫ
    // ============================================

    // Показывает ошибку рядом с нужным полем.
    function setFieldError(input, errorElement, message) {
      errorElement.textContent = message;
      errorElement.hidden = !message;
      input.setAttribute(
        "aria-invalid",
        String(Boolean(message))
      );
    }

    // Проверка названия задачи.
    function validateTaskName() {
      const name = taskName.value.trim();

      if (name.length === 0) {
        setFieldError(
          taskName,
          taskNameError,
          "Введите название задачи."
        );
        return false;
      }

      setFieldError(taskName, taskNameError, "");
      return true;
    }

    // Проверка количества часов.
    function validateTaskHours() {
      const rawValue = taskHours.value.trim();

      // Пустое значение проверяем до Number(),
      // поскольку Number("") возвращает 0.
      if (rawValue === "") {
        setFieldError(
          taskHours,
          taskHoursError,
          "Укажите количество часов."
        );
        return false;
      }

      // Разрешаем обычную десятичную запись числа.
      if (!/^\d+(?:\.\d+)?$/.test(rawValue)) {
        setFieldError(
          taskHours,
          taskHoursError,
          "Введите корректное число часов."
        );
        return false;
      }

      const hours = Number(rawValue);

      if (!Number.isFinite(hours)) {
        setFieldError(
          taskHours,
          taskHoursError,
          "Введите корректное число часов."
        );
        return false;
      }

      if (hours < 0.5) {
        setFieldError(
          taskHours,
          taskHoursError,
          "Минимум — 0,5 часа."
        );
        return false;
      }

      if (hours > 24) {
        setFieldError(
          taskHours,
          taskHoursError,
          "Максимум — 24 часа."
        );
        return false;
      }

      // Строгий шаг 0.5:
      // 0.5 * 2 = 1  -> допустимо
      // 1.5 * 2 = 3  -> допустимо
      // 0.75 * 2 = 1.5 -> недопустимо
      if (!Number.isInteger(hours * 2)) {
        setFieldError(
          taskHours,
          taskHoursError,
          "Используйте шаг 0,5 часа."
        );
        return false;
      }

      setFieldError(taskHours, taskHoursError, "");
      return true;
    }

    // Повторная проверка при редактировании
    // поля, в котором уже найдена ошибка.
    taskName.addEventListener("input", () => {
      if (taskName.getAttribute("aria-invalid") === "true") {
        validateTaskName();
      }
    });

    taskHours.addEventListener("input", () => {
      if (taskHours.getAttribute("aria-invalid") === "true") {
        validateTaskHours();
      }
    });

    // ============================================
    // ДОБАВЛЕНИЕ ЗАДАЧИ
    // ============================================

    taskForm.addEventListener("submit", event => {
      event.preventDefault();

      // Проверяем оба поля, чтобы показать все ошибки.
      const isNameValid = validateTaskName();
      const isHoursValid = validateTaskHours();

      if (!isNameValid || !isHoursValid) {
        // Ничего не очищаем и не добавляем.
        // Фокус переводим на первое некорректное поле.
        if (!isNameValid) {
          taskName.focus();
        } else {
          taskHours.focus();
        }
        return;
      }

      const name = taskName.value.trim();
      const hours = Number(taskHours.value);

      const id = typeof crypto !== "undefined" &&
                 typeof crypto.randomUUID === "function"
        ? crypto.randomUUID()
        : Date.now().toString(36) +
          Math.random().toString(36).slice(2);

      tasks.push({
        id,
        name,
        hours,
        done: false
      });

      saveTasks();
      render();

      // Очищаем форму только после успешного добавления.
      taskForm.reset();
      taskHours.value = "1";

      setFieldError(taskName, taskNameError, "");
      setFieldError(taskHours, taskHoursError, "");

      taskName.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        render();
      });
    });

    render();
  </script>
</body>
</html>
