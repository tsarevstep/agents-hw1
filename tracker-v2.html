<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-трекер учебных задач</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fa;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    .app {
      width: min(100% - 32px, 720px);
      margin: 36px auto;
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2rem); }
    h2 { margin: 0 0 16px; font-size: 1.15rem; }
    .subtitle { margin: 0 0 24px; color: #536079; }

    .panel {
      background: #fff;
      border: 1px solid #e0e5ee;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric { min-width: 0; padding: 12px; background: #f4f6fa; border-radius: 10px; }
    .metric span { display: block; color: #536079; font-size: 0.87rem; }
    .metric strong { display: block; margin-top: 4px; font-size: 1.5rem; }
    .progress-heading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    progress { display: block; width: 100%; height: 16px; accent-color: #2563eb; }

    .fields { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
    .field { min-width: 0; }
    label { display: block; font-weight: 600; margin-bottom: 7px; }

    input[type="text"] {
      width: 100%; min-width: 0; padding: 11px 12px;
      border: 1px solid #aeb8ca; border-radius: 8px;
      font: inherit; background: #fff; color: inherit;
    }

    input[aria-invalid="true"] { border-color: #b42318; }
    input:focus-visible, button:focus-visible, select:focus-visible {
      outline: 3px solid #93c5fd; outline-offset: 2px;
    }

    .error { min-height: 1.3em; margin: 5px 0 0; color: #b42318; font-size: 0.88rem; }
    button, select { font: inherit; }
    button { cursor: pointer; }

    .primary {
      margin-top: 8px; padding: 11px 17px; border: 0;
      border-radius: 8px; background: #1d4ed8; color: #fff; font-weight: 600;
    }

    .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .filter-label { margin: 0; font-weight: 500; }
    select { max-width: 100%; padding: 8px; border: 1px solid #aeb8ca; border-radius: 8px; background: #fff; }
    .filter-controls { display: flex; align-items: center; gap: 8px; }

    .task-list { list-style: none; padding: 0; margin: 4px 0 0; }
    .task {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px 0; border-bottom: 1px solid #e5e9f0;
    }
    .task:last-child { border-bottom: 0; }
    .task-content { display: flex; align-items: flex-start; gap: 11px; min-width: 0; flex: 1; }
    .task-content input { width: 18px; height: 18px; margin: 3px 0 0; flex: none; accent-color: #2563eb; cursor: pointer; }
    .task-text { min-width: 0; overflow-wrap: anywhere; }
    .task-title { display: block; font-weight: 600; margin: 0; }
    .task.done .task-title { color: #697589; text-decoration: line-through; }
    .task-hours { display: block; color: #536079; font-size: 0.9rem; margin-top: 3px; }

    .delete {
      flex: none; padding: 7px 10px; border: 1px solid #e4b4b0;
      border-radius: 8px; background: #fff; color: #a1261d;
    }
    .empty { margin: 8px 0 0; color: #536079; }
    .notice { margin: 0 0 18px; color: #8c351e; }
    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      .app { width: min(100% - 24px, 720px); margin: 20px auto; }
      .panel { padding: 16px; }
      .fields { grid-template-columns: 1fr; gap: 6px; }
      .list-heading { align-items: flex-start; flex-direction: column; }
      .task { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Учебные задачи на неделю</h1>
    <p class="subtitle">Планируйте часы и отмечайте выполненные задачи.</p>
    <p id="storage-notice" class="notice" role="status" hidden></p>

    <section class="panel" aria-labelledby="progress-title">
      <h2 id="progress-title">Прогресс</h2>
      <div class="summary">
        <div class="metric"><span>Всего часов</span><strong id="total-hours">8 ч</strong></div>
        <div class="metric"><span>Выполнено</span><strong id="done-hours">2 ч</strong></div>
      </div>
      <div class="progress-heading">
        <label for="progress-bar">Выполнение плана</label>
        <strong id="progress-percent">25%</strong>
      </div>
      <progress id="progress-bar" max="100" value="25">25%</progress>
    </section>

    <section class="panel" aria-labelledby="add-title">
      <h2 id="add-title">Добавить задачу</h2>
      <form id="task-form" novalidate>
        <div class="fields">
          <div class="field">
            <label for="task-title">Название задачи</label>
            <input id="task-title" type="text" autocomplete="off" aria-describedby="title-error" placeholder="Например, Конспект">
            <p id="title-error" class="error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="task-hours">Часы (0,5–24)</label>
            <input id="task-hours" type="text" inputmode="decimal" autocomplete="off" aria-describedby="hours-error" placeholder="Например, 1,5">
            <p id="hours-error" class="error" aria-live="polite"></p>
          </div>
        </div>
        <button class="primary" type="submit">Добавить задачу</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Список задач</h2>
        <div class="filter-controls">
          <label class="filter-label" for="task-filter">Показать:</label>
          <select id="task-filter">
            <option value="all">Все</option>
            <option value="active">Активные</option>
          </select>
        </div>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty" hidden>Задач в выбранном списке нет.</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'study-tracker-v2-tasks';
      const exampleTasks = [
        { id: '1', title: 'Чтение', hours: 2, done: true },
        { id: '2', title: 'Практика', hours: 4, done: false },
        { id: '3', title: 'Повторение', hours: 2, done: false }
      ];

      const form = document.getElementById('task-form');
      const titleInput = document.getElementById('task-title');
      const hoursInput = document.getElementById('task-hours');
      const titleError = document.getElementById('title-error');
      const hoursError = document.getElementById('hours-error');
      const filter = document.getElementById('task-filter');
      const list = document.getElementById('task-list');
      const emptyMessage = document.getElementById('empty-message');
      const notice = document.getElementById('storage-notice');
      const hourFormatter = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });

      let storageAvailable = true;

      function notifyStorageProblem(message) {
        storageAvailable = false;
        notice.textContent = message;
        notice.hidden = false;
      }

      function loadTasks() {
        try {
          const saved = window.localStorage.getItem(STORAGE_KEY);
          if (saved === null) return exampleTasks.map(task => ({ ...task }));

          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error('Invalid stored tasks');

          const ids = new Set();
          const valid = parsed.every(task => {
            if (!task || typeof task !== 'object') return false;
            const id = String(task.id);
            if (!/^[1-9]\d*$/.test(id) || ids.has(id)) return false;
            ids.add(id);
            return typeof task.title === 'string' && task.title.trim().length > 0 &&
              typeof task.hours === 'number' && Number.isFinite(task.hours) &&
              task.hours >= 0.5 && task.hours <= 24 && Number.isInteger(task.hours * 2) &&
              typeof task.done === 'boolean';
          });
          if (!valid) throw new Error('Invalid stored tasks');
          return parsed.map(task => ({ id: String(task.id), title: task.title, hours: task.hours, done: task.done }));
        } catch (error) {
          notifyStorageProblem('Не удалось прочитать хранилище. Задачи доступны в памяти до обновления страницы.');
          return exampleTasks.map(task => ({ ...task }));
        }
      }

      let tasks = loadTasks();
      let nextId = tasks.reduce((max, task) => Math.max(max, Number(task.id)), 0) + 1;

      function saveTasks() {
        if (!storageAvailable) return;
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          notifyStorageProblem('Не удалось сохранить задачи. Можно продолжать работу, но после обновления страницы изменения могут исчезнуть.');
        }
      }

      function formatHours(value) {
        return `${hourFormatter.format(value)} ч`;
      }

      function render() {
        const total = tasks.reduce((sum, task) => sum + task.hours, 0);
        const done = tasks.reduce((sum, task) => sum + (task.done ? task.hours : 0), 0);
        const percent = total === 0 ? 0 : Math.round(100 * done / total);

        document.getElementById('total-hours').textContent = formatHours(total);
        document.getElementById('done-hours').textContent = formatHours(done);
        document.getElementById('progress-percent').textContent = `${percent}%`;
        const progress = document.getElementById('progress-bar');
        progress.value = percent;
        progress.textContent = `${percent}%`;

        list.replaceChildren();
        const visible = tasks.filter(task => filter.value !== 'active' || !task.done);
        emptyMessage.hidden = visible.length !== 0;

        for (const task of visible) {
          const item = document.createElement('li');
          item.className = task.done ? 'task done' : 'task';

          const content = document.createElement('div');
          content.className = 'task-content';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = task.done;
          checkbox.setAttribute('aria-label', `Выполнено: ${task.title}`);
          checkbox.addEventListener('change', () => {
            task.done = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement('div');
          text.className = 'task-text';
          const title = document.createElement('span');
          title.className = 'task-title';
          title.textContent = task.title;
          const hours = document.createElement('span');
          hours.className = 'task-hours';
          hours.textContent = formatHours(task.hours);
          text.append(title, hours);
          content.append(checkbox, text);

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'delete';
          deleteButton.textContent = 'Удалить';
          deleteButton.setAttribute('aria-label', `Удалить задачу «${task.title}»`);
          deleteButton.addEventListener('click', () => {
            tasks = tasks.filter(entry => entry.id !== task.id);
            saveTasks();
            render();
          });

          item.append(content, deleteButton);
          list.append(item);
        }
      }

      function setFieldError(input, messageNode, message) {
        messageNode.textContent = message;
        input.setAttribute('aria-invalid', message ? 'true' : 'false');
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const title = titleInput.value.trim();
        const rawHours = hoursInput.value.trim();
        const normalizedHours = rawHours.replace(',', '.');
        const hours = Number(normalizedHours);

        const titleMessage = title ? '' : 'Введите название задачи.';
        let hoursMessage = '';
        if (!rawHours) {
          hoursMessage = 'Введите количество часов.';
        } else if (!/^\d+(?:\.\d+)?$/.test(normalizedHours) || !Number.isFinite(hours)) {
          hoursMessage = 'Введите число от 0,5 до 24 с шагом 0,5.';
        } else if (hours < 0.5 || hours > 24 || !Number.isInteger(hours * 2)) {
          hoursMessage = 'Допустимо от 0,5 до 24 с шагом 0,5.';
        }

        setFieldError(titleInput, titleError, titleMessage);
        setFieldError(hoursInput, hoursError, hoursMessage);
        if (titleMessage || hoursMessage) return;

        tasks.push({ id: String(nextId++), title, hours, done: false });
        saveTasks();
        form.reset();
        setFieldError(titleInput, titleError, '');
        setFieldError(hoursInput, hoursError, '');
        render();
      });

      filter.addEventListener('change', render);
      render();
    })();
  </script>
</body>
</html>
